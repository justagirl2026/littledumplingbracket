<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Little Dumpling's Name Bracket — Leaderboard</title>
<style>
:root{--paper:#fbf8f2;--ink:#302821;--brown:#7b432f;--line:#8b6a5b;--soft:#f0ddd0;--muted:#9b8c82;--white:#fffaf4;--green:#6f8064;--gold:#c39a4a}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif}header{text-align:center;padding:25px 12px 8px;color:var(--brown)}header small{letter-spacing:.25em;font-weight:700}h1{font-size:clamp(34px,4vw,52px);margin:5px}.subtitle{font:13px Arial,sans-serif;color:#76685f}.wrap{max-width:1180px;margin:auto;padding:18px 22px 42px}.hero{display:grid;grid-template-columns:1fr 1.35fr;gap:24px;align-items:stretch}.card{background:#fff8f1;border:1.5px solid #d8c8bd;border-radius:28px;padding:24px;box-shadow:0 10px 28px #5037280d}.eyebrow{font:700 11px Arial,sans-serif;letter-spacing:.18em;color:var(--brown);text-transform:uppercase}.survival{text-align:center;display:flex;flex-direction:column;justify-content:center}.big{font-size:clamp(70px,9vw,112px);line-height:.9;color:var(--brown);font-weight:700;margin:18px 0 7px}.biglabel{font-size:23px;font-weight:700}.substat{font:14px Arial,sans-serif;color:#76685f;margin-top:8px}.meter{height:13px;background:#eadfd7;border-radius:99px;overflow:hidden;margin:22px 0 7px}.meter>div{height:100%;width:0;background:var(--brown);border-radius:99px;transition:width .9s ease}.rate{font:700 12px Arial,sans-serif;color:var(--brown)}.top5 h2{margin:5px 0 16px;color:var(--brown);font-size:28px}.row{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid #e5d9d1;transition:.45s}.row:last-child{border:0}.place{font-size:20px;text-align:center}.person{font-weight:700;font-size:17px}.state{display:block;font:10px Arial,sans-serif;margin-top:3px;color:var(--muted);letter-spacing:.04em}.alive .state{color:var(--green);font-weight:700}.out{opacity:.48}.score{text-align:right}.points{font-size:22px;font-weight:700;color:var(--brown)}.ptslabel{font:9px Arial,sans-serif;color:#877970;text-transform:uppercase;letter-spacing:.1em}.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:24px}.stage{border:1px solid #ddcfc6;border-radius:20px;padding:14px 8px;text-align:center;background:#fffaf5;opacity:.35;transition:.45s}.stage.active{opacity:1;border-color:var(--brown);background:var(--soft)}.stage.done{opacity:.72}.stage-name{font:700 10px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}.stage-num{font-size:26px;color:var(--brown);font-weight:700;margin:5px}.stage-small{font:10px Arial,sans-serif;color:#76685f}.controls{text-align:center;margin-top:25px;font-family:Arial,sans-serif}.round-banner{font:700 19px Georgia,serif;color:var(--brown);min-height:25px;margin-bottom:5px}#status{font-size:12px;color:#786b62;margin:8px 0}.error{color:#9a3c32!important}button{border:0;border-radius:30px;padding:14px 25px;margin:5px;background:var(--brown);color:#fff;font-weight:700;font-size:14px;cursor:pointer}.secondary{background:#e5d8cf;color:var(--ink)}button:disabled{opacity:.4;cursor:not-allowed}.hidden-state .big,.hidden-state .biglabel,.hidden-state .substat,.hidden-state .rate,.hidden-state .row{filter:blur(8px);opacity:.18}.hidden-state .meter>div{width:0!important}@keyframes pop{0%{transform:scale(.92);opacity:.2}70%{transform:scale(1.025)}100%{transform:scale(1);opacity:1}}.pop{animation:pop .55s ease}@media(max-width:760px){.hero{grid-template-columns:1fr}.timeline{grid-template-columns:1fr 1fr}.stage:last-child{grid-column:1/-1}.wrap{padding:12px}.card{padding:18px}}
</style></head>
<body>
<header><small>THE LITTLE DUMPLING'S</small><h1>🥟 BRACKET LEADERBOARD 🥟</h1><div class="subtitle">Who still has a shot at the podium?</div></header>
<div class="wrap">
 <div class="hero hidden-state" id="hero">
  <section class="card survival"><div class="eyebrow" id="stageTitle">Starting Field</div><div class="big" id="alive">—</div><div class="biglabel">BRACKETS STILL ALIVE</div><div class="substat" id="eliminated">Waiting for the reveal…</div><div class="meter"><div id="meter"></div></div><div class="rate" id="rate">—</div></section>
  <section class="card top5"><div class="eyebrow">CURRENT STANDINGS</div><h2>Top 5 Brackets</h2><div id="topRows"></div></section>
 </div>
 <div class="timeline" id="timeline"></div>
 <div class="controls"><div class="round-banner" id="banner">BRACKET SURVIVAL</div><div id="status">Loading live leaderboard…</div><button id="next" disabled>Reveal Starting Field</button><button class="secondary" id="reset">Reset Reveal</button></div>
</div>
<script>
const ENDPOINT="https://script.google.com/macros/s/AKfycbz8c_izp_i0l-Vl8c8oR6xK90Pfp7unfEed1WNfFfetaE3WUpaeEn4qrHN9gfEfdeBH/exec";
const stages=["Starting Field","After Round 1","After Round 2","After Semifinals","Ultimate Winner"];
let payload=null,step=0;
function esc(s){return String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function receiveLeaderboard(x){
 if(!x||!Array.isArray(x.leaderboard)||!Array.isArray(x.survival)){status.textContent="Leaderboard data is incomplete. Update Apps Script first.";status.className="error";return}
 payload=x;status.textContent="Live leaderboard loaded · Everything is hidden until you reveal it.";next.disabled=false;drawTimeline();updateButton();
}
function load(){const s=document.createElement("script");s.src=ENDPOINT+"?view=leaderboard&callback=receiveLeaderboard&_="+Date.now();s.onerror=()=>{status.textContent="Could not load the live leaderboard. Refresh and try again.";status.className="error"};document.body.appendChild(s)}
function drawTimeline(){timeline.innerHTML=stages.map((s,i)=>`<div class="stage" id="stage-${i}"><div class="stage-name">${s}</div><div class="stage-num">?</div><div class="stage-small">hidden</div></div>`).join("")}
function scoreForStage(p,i){if(i===0)return 0;if(i===1)return Number(p.r1)||0;if(i===2)return (Number(p.r1)||0)+(Number(p.r2)||0);if(i===3)return (Number(p.r1)||0)+(Number(p.r2)||0)+(Number(p.sf)||0);return Number(p.total)||0}
function render(i){
 const s=payload.survival[i]||{alive:0,eliminated:0,rate:0};stageTitle.textContent=stages[i];alive.textContent=s.alive;eliminated.textContent=i===0?`${s.alive} brackets entered the madness`:`${s.eliminated} eliminated this round`;rate.textContent=`${Number(s.rate).toFixed(1)}% of the starting field still alive`;meter.style.width=Math.max(0,Math.min(100,Number(s.rate)))+"%";
 const ranked=payload.leaderboard.map(p=>({...p,displayScore:scoreForStage(p,i)})).sort((a,b)=>b.displayScore-a.displayScore||String(a.name).localeCompare(String(b.name))).slice(0,5);
 topRows.innerHTML=ranked.map((p,n)=>{const aliveNow=(p.aliveThrough??-1)>=i;return `<div class="row ${aliveNow?'alive':'out'}"><div class="place">${['🥇','🥈','🥉','4','5'][n]}</div><div class="person">${esc(p.name)}<span class="state">${aliveNow?'🥟 ULTIMATE PICK STILL ALIVE':'ULTIMATE PICK ELIMINATED'}</span></div><div class="score"><div class="points">${p.displayScore}</div><div class="ptslabel">points</div></div></div>`}).join("");
 document.querySelectorAll('.stage').forEach((e,n)=>{e.className='stage '+(n===i?'active':n<i?'done':'');if(n<=i){const d=payload.survival[n];e.querySelector('.stage-num').textContent=d.alive;e.querySelector('.stage-small').textContent=n===0?'entered':`${Number(d.rate).toFixed(0)}% survive`}});
 hero.classList.remove('hidden-state');hero.classList.remove('pop');void hero.offsetWidth;hero.classList.add('pop');status.textContent=i===4?'Final standings revealed · Time for the podium!':`${stages[i]} revealed.`;
}
function updateButton(){const labels=["Reveal Starting Field","Reveal Round 1 Standings","Reveal Round 2 Standings","Reveal Semifinal Standings","Reveal Final Leaderboard"];if(step<labels.length){next.textContent=labels[step];banner.textContent=step===4?'THE FINAL LEADERBOARD':'BRACKET SURVIVAL'}else{next.textContent='Leaderboard Revealed';next.disabled=true;banner.textContent='🏆 FINAL STANDINGS'}}
function reveal(){if(!payload||step>=5)return;render(step);step++;updateButton()}
next.onclick=reveal;reset.onclick=()=>location.reload();drawTimeline();load();
</script></body></html>
