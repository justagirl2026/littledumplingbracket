<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Little Dumpling's Name Bracket — Live Results</title>
<style>
:root{--paper:#fbf8f2;--ink:#302821;--brown:#754330;--line:#665950;--soft:#ead8ce;--win:#f0ddd0;--muted:#9d8f84}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
header{text-align:center;padding:28px 12px 8px;color:var(--brown)}
header small{letter-spacing:.24em;font-weight:700}h1{font-size:clamp(34px,4vw,52px);margin:5px}
.dumpling{font-size:32px;display:inline-block;animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px) rotate(2deg)}}
.subtitle{font-family:Arial,sans-serif;font-size:13px;color:#76685f}
.stage{overflow-x:auto;padding:18px 24px 8px}
.bracket{min-width:1240px;max-width:1420px;height:690px;margin:auto;display:grid;grid-template-columns:215px 185px 170px 225px 170px 185px 215px;gap:22px}
.col{display:flex;flex-direction:column;justify-content:space-around}.r2{padding:65px 0}.sf{padding:165px 0}.center{justify-content:center}
.match{display:flex;flex-direction:column;gap:7px}
.pill{border:1.5px solid var(--line);border-radius:28px;min-height:49px;padding:9px 11px;text-align:center;display:flex;align-items:center;justify-content:center;letter-spacing:.08em;font-size:14px;font-weight:700;background:#fff8;transition:.45s}
.pill.pending{color:var(--muted);border-color:#aaa099}.pill.winner{background:var(--win);border-color:var(--brown);box-shadow:0 5px 16px #4f39251a}.pill.loser{opacity:.35}.seed{font-size:10px;color:#76685e;margin-right:5px}
.champ{border:2px solid var(--brown);border-radius:32px;padding:30px 15px;text-align:center;background:#fffaf3;box-shadow:0 10px 28px #50372814}
.champ small{letter-spacing:.15em;color:var(--brown);font-weight:700}.champ-name{font-size:31px;font-weight:700;color:var(--brown);margin-top:12px;min-height:38px}
.controls{text-align:center;max-width:680px;margin:5px auto 38px;padding:0 15px;font-family:Arial,sans-serif}
.card{display:none;border:1px solid #d7c5b8;background:#fffaf4;border-radius:18px;padding:16px;margin-bottom:12px;line-height:1.7}.card.show{display:block}
.card-title{font:700 21px Georgia,serif;color:var(--brown)}
button{border:0;border-radius:30px;padding:13px 22px;margin:5px;background:var(--brown);color:#fff;font-weight:700;cursor:pointer}.secondary{background:#e5d8cf;color:var(--ink)}button:disabled{opacity:.4;cursor:not-allowed}
#status{font-size:12px;color:#786b62;margin:8px 0}.error{color:#9a3c32!important}
</style>
</head>
<body>
<header><small>THE LITTLE DUMPLING'S</small><h1><span class="dumpling">🥟</span> NAME BRACKET <span class="dumpling">🥟</span></h1><div class="subtitle">The Official Results Reveal</div></header>
<div class="stage"><div class="bracket">
<div class="col" id="lr1"></div><div class="col r2" id="lr2"></div><div class="col sf" id="lsf"></div>
<div class="col center"><div class="champ"><div style="font-size:30px" id="mascot">🥟</div><small>THE LITTLE DUMPLING'S<br>ULTIMATE NAME</small><div class="champ-name" id="champ">?????</div></div></div>
<div class="col sf" id="rsf"></div><div class="col r2" id="rr2"></div><div class="col" id="rr1"></div>
</div></div>
<div class="controls">
<div class="card" id="card"><div class="card-title" id="cardTitle"></div><div id="cardVotes"></div></div>
<div id="status">Loading the official tally…</div>
<button id="next" disabled>Reveal Next Matchup</button><button class="secondary" id="reset">Reset Reveal</button>
</div>

<script>
const ENDPOINT="https://script.google.com/macros/s/AKfycbz8c_izp_i0l-Vl8c8oR6xK90Pfp7unfEed1WNfFfetaE3WUpaeEn4qrHN9gfEfdeBH/exec";
const seeds={Avery:1,Val:2,Rhys:3,Liam:4,Hieu:5,Logan:6,Aiden:7,Augusta:8,Bailey:9,Lucas:10,Caleb:11,Callahan:12,Arlo:13,"Jared Jr.":14,Hannala:15,Stump:16};

/* Visual arrangement preserves the symmetrical PDF feel, while the IDs map to
   the ACTUAL voting bracket:
   R1 0+1 -> R2 0; R1 2+3 -> R2 1; R1 4+5 -> R2 2; R1 6+7 -> R2 3.
   R2 0+1 -> SF 0; R2 2+3 -> SF 1. */
const leftIndexes=[0,1,2,3];
const rightIndexes=[7,6,5,4];

let data=[],step=0;

function nameHTML(n){return `<span class="seed">${seeds[n]??""} -</span>${n}`}
function pill(n,id,pending=false){return `<div class="pill ${pending?"pending":""}" id="${id}">${pending?"?????":nameHTML(n)}</div>`}
function build(){
 const base=[
  ["Avery","Stump"],["Augusta","Bailey"],["Hieu","Callahan"],["Liam","Arlo"],
  ["Logan","Caleb"],["Rhys","Jared Jr."],["Aiden","Lucas"],["Val","Hannala"]
 ];
 lr1.innerHTML=leftIndexes.map(i=>`<div class="match">${pill(base[i][0],`r1-${i}-a`)}${pill(base[i][1],`r1-${i}-b`)}</div>`).join("");
 rr1.innerHTML=rightIndexes.map(i=>`<div class="match">${pill(base[i][0],`r1-${i}-a`)}${pill(base[i][1],`r1-${i}-b`)}</div>`).join("");
 lr2.innerHTML=pill("",`r2-0`,true)+pill("",`r2-1`,true);
 rr2.innerHTML=pill("",`r2-3`,true)+pill("",`r2-2`,true);
 lsf.innerHTML=pill("",`sf-0`,true); rsf.innerHTML=pill("",`sf-1`,true);
}
function setPill(id,n){
 const e=document.getElementById(id); e.className="pill winner"; e.innerHTML=nameHTML(n);
}
function pct(v,t){return t?((v/t)*100).toFixed(1):"0.0"}

async function load(){
 try{
  const response=await fetch(ENDPOINT,{cache:"no-store"});
  if(!response.ok) throw new Error("Could not load results");
  data=await response.json();
  if(!Array.isArray(data)||data.length<15) throw new Error("Incomplete tally data");
  status.textContent="Official tally loaded · Ready to reveal Round 1";
  next.disabled=false;
 }catch(err){
  status.textContent="Could not load the live tally. Refresh the page and try again.";
  status.className="error";
  console.error(err);
 }
}

function reveal(){
 if(step>=15)return;
 const r=data[step],a=r.name1,b=r.name2,av=Number(r.votes1)||0,bv=Number(r.votes2)||0,w=r.winner,t=av+bv;
 card.className="card show";
 cardTitle.textContent=`${r.round}: ${w} advances!`;
 cardVotes.innerHTML=`${a}: <b>${av} votes · ${pct(av,t)}%</b><br>${b}: <b>${bv} votes · ${pct(bv,t)}%</b>`;

 if(step<8){
   const winId=`r1-${step}-${w===a?"a":"b"}`,loseId=`r1-${step}-${w===a?"b":"a"}`;
   document.getElementById(winId).classList.add("winner");
   document.getElementById(loseId).classList.add("loser");
   setPill(`r2-${Math.floor(step/2)}`,w);
 } else if(step<12){
   setPill(`sf-${Math.floor((step-8)/2)}`,w);
 } else if(step===14){
   champ.textContent=w; mascot.textContent="🎉 🥟 🏆 🥟 🎉";
 }
 step++;
 const phase=step<8?"Round 1":step<12?"Round 2":step<14?"Semifinals":step<15?"Championship":"Complete";
 status.textContent=step===15?"The Little Dumpling has a champion!":`${phase} · ${step} of 15 results revealed`;
 if(step===15){next.disabled=true;next.textContent="Champion Revealed 🏆"}
}
next.onclick=reveal;
reset.onclick=()=>location.reload();
build();load();
</script>
</body></html>
